<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rajputana Shringar — Rajputi Poshak & Jewellery</title>
  <meta name="description" content="Traditional Rajputi poshak, odhna, men's attire and kundan jewellery.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🏰</span>
      <div>
        <h1>Rajputana Shringar</h1>
        <p>Rajputi Poshak & Paramparik Jewellery</p>
      </div>
    </div>
    <button class="cart-btn" id="cartBtn" aria-label="Open cart">
      🛍️ <span id="cartCount">0</span>
    </button>
  </header>

  <section class="hero">
    <h2>Shaan-e-Rajputana</h2>
    <p>Handcrafted poshak, safa and kundan jewellery, made the traditional way.</p>
  </section>

  <main class="container">
    <div class="controls">
      <input type="search" id="search" placeholder="Search poshak, borla, nath, safa…" aria-label="Search products">
      <select id="sort" aria-label="Sort products">
        <option value="featured">Featured</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
      </select>
    </div>
    <nav class="chips" id="categories" aria-label="Categories"></nav>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No products match your search.</p>
  </main>

  <!-- Product detail -->
  <dialog id="productDialog" class="modal">
    <div id="productBody"></div>
  </dialog>

  <!-- Cart drawer -->
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h3>Your Cart</h3>
      <button class="icon-btn" id="closeCart" aria-label="Close cart">✕</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="drawer-foot">
      <div class="total"><span>Total</span><strong id="cartTotal">₹0</strong></div>
      <button class="btn primary" id="checkoutBtn">Checkout</button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <!-- Checkout -->
  <dialog id="checkoutDialog" class="modal">
    <form id="checkoutForm" method="dialog">
      <h3>Delivery Details</h3>
      <label>Full name<input name="name" required></label>
      <label>Phone<input name="phone" type="tel" pattern="[0-9]{10}" placeholder="10-digit mobile" required></label>
      <label>Address<textarea name="address" rows="3" required></textarea></label>
      <label>City<input name="city" required></label>
      <label>Pincode<input name="pincode" pattern="[0-9]{6}" required></label>
      <label>Notes (size, wrist size, colour)<textarea name="notes" rows="2"></textarea></label>
      <div class="row">
        <button type="button" class="btn" id="cancelCheckout">Cancel</button>
        <button type="submit" class="btn primary">Place Order</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <footer class="footer">
    <p>© Rajputana Shringar · Jaipur · Jodhpur · Udaipur</p>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
