<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Firefly Snake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* Layout: one screen — header strip, square meadow board centered, d-pad below on touch. Single dusk look by choice. */
  :root {
    --dusk: #171a33;
    --dusk-2: #222647;
    --grass: #2c3a4f;
    --snake: #8fbf9f;
    --snake-head: #c4e3c9;
    --glow: #ffc857;
    --ink: #eceaf6;
    --muted: #9a9cc0;
    --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, var(--dusk-2), var(--dusk) 70%);
    background-color: var(--dusk);
    color: var(--ink);
    font-family: var(--mono);
    display: flex; flex-direction: column; align-items: center;
    gap: 12px;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  header {
    width: 100%; max-width: 560px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  h1 {
    font-family: var(--display); font-weight: 800; font-size: clamp(1.5rem, 5vw, 2.1rem);
    margin: 0; line-height: 1; letter-spacing: -0.02em; text-wrap: balance;
  }
  h1 span { color: var(--glow); text-shadow: 0 0 18px color-mix(in srgb, var(--glow) 60%, transparent); }
  .scores { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
  .scores div { display: flex; flex-direction: column; align-items: flex-end; }
  .scores small { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .scores b { font-size: 1.35rem; font-weight: 600; }
  .stage { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; max-width: 560px; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; border-radius: 14px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--muted) 25%, transparent), 0 20px 60px rgba(0,0,0,.45); touch-action: none; max-width: 100%; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-align: center; padding: 16px;
  }
  .overlay h2 { font-family: var(--display); font-weight: 800; font-size: clamp(1.6rem, 6vw, 2.6rem); margin: 0; text-wrap: balance; }
  .overlay p { margin: 0; color: var(--muted); max-width: 32ch; line-height: 1.5; font-size: 0.9rem; }
  button {
    font: 600 0.95rem var(--mono); color: var(--dusk); background: var(--glow);
    border: 0; border-radius: 999px; padding: 12px 26px; cursor: pointer;
    box-shadow: 0 0 24px color-mix(in srgb, var(--glow) 45%, transparent);
  }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .pad { display: none; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 48px); gap: 8px; }
  .pad button { padding: 0; background: var(--dusk-2); color: var(--ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--muted) 35%, transparent); font-size: 1.2rem; border-radius: 12px; }
  .pad .up { grid-column: 2; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .hint-touch { display: none; }
  @media (pointer: coarse) { .pad { display: grid; } .hint-keys { display: none; } .hint-touch { display: inline; } }
  .hint { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.04em; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>Firefly <span>Snake</span></h1>
  <div class="scores">
    <div><small>Fireflies</small><b id="score">0</b></div>
    <div><small>Best</small><b id="best">0</b></div>
  </div>
</header>

<div class="stage" id="stage">
  <canvas id="board" aria-label="Game board"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="ovTitle">Catch the fireflies</h2>
    <p id="ovText">Guide the snake across the meadow. Each firefly makes you longer. Every fifth one, the night speeds up. Don't bite your own tail.</p>
    <button id="startBtn" type="button">Start</button>
  </div>
</div>

<div class="pad" aria-label="Direction controls">
  <button class="up" type="button" data-dir="up" aria-label="Up">▲</button>
  <button class="left" type="button" data-dir="left" aria-label="Left">◀</button>
  <button class="down" type="button" data-dir="down" aria-label="Down">▼</button>
  <button class="right" type="button" data-dir="right" aria-label="Right">▶</button>
</div>
<div class="hint"><span class="hint-keys">Arrow keys or WASD to steer · Space to pause</span><span class="hint-touch">Swipe on the board or tap the arrows</span></div>

<script>
(() => {
  const COLS = 20, ROWS = 20;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const css = getComputedStyle(document.documentElement);
  const C = k => css.getPropertyValue(k).trim();
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  let best = 0;
  try { best = +localStorage.getItem('firefly-snake-best') || 0; } catch {}
  bestEl.textContent = best;

  let snake, dir, queue, fly, score, state, stepMs, acc, last, cell, sparks, ambient;

  function reset() {
    snake = [[6, 10], [5, 10], [4, 10]];
    dir = 'right'; queue = [];
    score = 0; stepMs = 140; acc = 0; sparks = [];
    scoreEl.textContent = 0;
    placeFly();
  }

  function placeFly() {
    const free = [];
    for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++)
      if (!snake.some(s => s[0] === x && s[1] === y)) free.push([x, y]);
    fly = free[Math.floor(Math.random() * free.length)];
    fly.born = performance.now();
  }

  function resize() {
    const r = stage.getBoundingClientRect();
    const size = Math.max(200, Math.floor(Math.min(r.width, r.height)));
    cell = Math.floor(size / COLS);
    const px = cell * COLS;
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = canvas.style.height = px + 'px';
    canvas.width = canvas.height = px * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ambient = Array.from({ length: 26 }, () => ({ x: Math.random() * px, y: Math.random() * px, p: Math.random() * 6.28 }));
    draw(performance.now());
  }

  function turn(d) {
    const lastDir = queue.length ? queue[queue.length - 1] : dir;
    const [lx, ly] = DIRS[lastDir], [nx, ny] = DIRS[d];
    if (lx + nx === 0 && ly + ny === 0) return;
    if (d === lastDir) return;
    if (queue.length < 3) queue.push(d);
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const [dx, dy] = DIRS[dir];
    const head = [snake[0][0] + dx, snake[0][1] + dy];
    const eating = head[0] === fly[0] && head[1] === fly[1];
    const body = eating ? snake : snake.slice(0, -1);
    if (head[0] < 0 || head[1] < 0 || head[0] >= COLS || head[1] >= ROWS ||
        body.some(s => s[0] === head[0] && s[1] === head[1])) return gameOver();
    snake.unshift(head);
    if (eating) {
      score++; scoreEl.textContent = score;
      burst(fly);
      if (score % 5 === 0) stepMs = Math.max(60, stepMs - 12);
      if (snake.length === COLS * ROWS) return gameOver(true);
      placeFly();
    } else snake.pop();
  }

  function burst([x, y]) {
    if (reduceMotion) return;
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * 6.28, v = 0.6 + Math.random() * 1.6;
      sparks.push({ x: (x + .5) * cell, y: (y + .5) * cell, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1 });
    }
  }

  function gameOver(won) {
    state = 'over';
    if (score > best) {
      best = score; bestEl.textContent = best;
      try { localStorage.setItem('firefly-snake-best', best); } catch {}
    }
    ovTitle.textContent = won ? 'The meadow is yours' : 'Tangled up';
    ovText.textContent = `You caught ${score} firefl${score === 1 ? 'y' : 'ies'}.` + (score && score === best ? ' New best!' : ` Best: ${best}.`);
    startBtn.textContent = 'Play again';
    overlay.hidden = false;
    startBtn.focus();
  }

  function start() {
    reset(); state = 'play'; overlay.hidden = true; last = performance.now();
  }

  function togglePause() {
    if (state === 'play') {
      state = 'paused';
      ovTitle.textContent = 'Paused'; ovText.textContent = 'The fireflies will wait.';
      startBtn.textContent = 'Resume'; overlay.hidden = false; startBtn.focus();
    } else if (state === 'paused') {
      state = 'play'; overlay.hidden = true; last = performance.now();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
  }

  function draw(t) {
    const px = cell * COLS;
    ctx.fillStyle = C('--dusk'); ctx.fillRect(0, 0, px, px);
    // meadow checker
    ctx.fillStyle = C('--grass');
    for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++)
      if ((x + y) % 2 === 0) { ctx.globalAlpha = 0.35; ctx.fillRect(x * cell, y * cell, cell, cell); }
    ctx.globalAlpha = 1;
    // ambient distant fireflies
    ctx.fillStyle = C('--glow');
    for (const a of ambient) {
      ctx.globalAlpha = 0.08 + 0.12 * (0.5 + 0.5 * Math.sin(t / 900 + a.p));
      ctx.beginPath(); ctx.arc(a.x, a.y, 1.4, 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // firefly
    if (fly) {
      const pulse = reduceMotion ? 0.8 : 0.55 + 0.45 * Math.sin(t / 220);
      const cx = (fly[0] + .5) * cell, cy = (fly[1] + .5) * cell;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, cell * 1.4);
      g.addColorStop(0, C('--glow')); g.addColorStop(1, 'rgba(255,200,87,0)');
      ctx.globalAlpha = 0.35 + 0.4 * pulse; ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, cell * 1.4, 0, 6.28); ctx.fill();
      ctx.globalAlpha = 1; ctx.fillStyle = C('--glow');
      ctx.beginPath(); ctx.arc(cx, cy, cell * 0.2 + pulse * cell * 0.06, 0, 6.28); ctx.fill();
    }
    // snake
    const pad = Math.max(1, cell * 0.1);
    snake.forEach(([x, y], i) => {
      const fade = 1 - (i / snake.length) * 0.45;
      ctx.globalAlpha = fade;
      ctx.fillStyle = i === 0 ? C('--snake-head') : C('--snake');
      roundRect(x * cell + pad, y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.32); ctx.fill();
    });
    ctx.globalAlpha = 1;
    // eyes
    const [hx, hy] = snake[0], [dx, dy] = DIRS[queue[0] || dir];
    const ex = (hx + .5) * cell + dx * cell * .16, ey = (hy + .5) * cell + dy * cell * .16;
    ctx.fillStyle = C('--dusk');
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.arc(ex + dy * s * cell * .17, ey + dx * s * cell * .17, cell * .07, 0, 6.28); ctx.fill();
    }
    // sparks
    ctx.fillStyle = C('--glow');
    sparks = sparks.filter(s => s.life > 0);
    for (const s of sparks) {
      s.x += s.vx; s.y += s.vy; s.life -= 0.03;
      ctx.globalAlpha = Math.max(0, s.life);
      ctx.beginPath(); ctx.arc(s.x, s.y, 1.8, 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function loop(t) {
    if (state === 'play') {
      acc += t - last; last = t;
      while (acc >= stepMs && state === 'play') { acc -= stepMs; step(); }
    }
    draw(t);
    requestAnimationFrame(loop);
  }

  const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
  addEventListener('keydown', e => {
    if (KEYS[e.key]) {
      e.preventDefault();
      if (state === 'play') turn(KEYS[e.key]);
      else if (state === 'ready') { start(); turn(KEYS[e.key]); }
    } else if (e.key === ' ' || e.key === 'p' || e.key === 'Escape') {
      if (state === 'play' || state === 'paused') { e.preventDefault(); togglePause(); }
    }
  });
  startBtn.addEventListener('click', () => state === 'paused' ? togglePause() : start());
  document.querySelectorAll('.pad button').forEach(b =>
    b.addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'play') turn(b.dataset.dir); }));
  let touch = null;
  canvas.addEventListener('pointerdown', e => { touch = [e.clientX, e.clientY]; });
  canvas.addEventListener('pointerup', e => {
    if (!touch || state !== 'play') return;
    const dx = e.clientX - touch[0], dy = e.clientY - touch[1];
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 18)
      turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    touch = null;
  });
  addEventListener('blur', () => { if (state === 'play') togglePause(); });
  addEventListener('resize', resize);

  reset(); state = 'ready';
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
