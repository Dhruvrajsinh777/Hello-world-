<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Night</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Rubik:wght@400;500;700&display=swap">
<style>
  /* Layout: a single centered quiz card; progress strip on top, question, four answer buttons in a 2x2 grid (1 column on phones). */
  :root {
    --bg: #eef0f7;
    --card: #ffffff;
    --ink: #1d1f33;
    --muted: #63678a;
    --line: #d9dcea;
    --accent: #3d4fd6;
    --accent-ink: #ffffff;
    --good: #17895a;
    --good-bg: #ddf3e8;
    --bad: #c23a3a;
    --bad-bg: #fbe3e3;
    --display: "Dela Gothic One", "Arial Black", Impact, sans-serif;
    --body: "Rubik", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12142a; --card: #1c1f3b; --ink: #ecedf8; --muted: #a2a6cc; --line: #2f3360;
      --accent: #8b97ff; --accent-ink: #12142a; --good: #4fd39a; --good-bg: #173a33; --bad: #ff8585; --bad-bg: #3d1f2a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12142a; --card: #1c1f3b; --ink: #ecedf8; --muted: #a2a6cc; --line: #2f3360;
    --accent: #8b97ff; --accent-ink: #12142a; --good: #4fd39a; --good-bg: #173a33; --bad: #ff8585; --bad-bg: #3d1f2a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0;
    background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px;
    min-height: 100%; display: flex; justify-content: center;
    padding-block: 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 18px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.6rem, 6vw, 2.2rem); margin: 0; line-height: 1; letter-spacing: 0.01em; }
  h1 span { color: var(--accent); }
  .stat { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
  .stat div { display: flex; flex-direction: column; align-items: flex-end; }
  .stat small { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
  .stat b { font-size: 1.3rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: clamp(20px, 5vw, 32px); display: flex; flex-direction: column; gap: 20px; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--muted); }
  .chip { background: var(--bg); border-radius: 999px; padding: 4px 12px; font-weight: 500; letter-spacing: 0.04em; }
  .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 100%; transition: width 0.1s linear; }
  .bar.low i { background: var(--bad); }
  .q { font-size: clamp(1.2rem, 4.5vw, 1.55rem); font-weight: 700; line-height: 1.3; margin: 0; text-wrap: balance; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .answers { grid-template-columns: 1fr; } }
  .answers button {
    font: 500 1rem var(--body); color: var(--ink); text-align: left;
    background: var(--card); border: 2px solid var(--line); border-radius: 14px;
    padding: 14px 16px; cursor: pointer; display: flex; gap: 12px; align-items: center; min-width: 0;
    transition: border-color 0.15s, transform 0.1s;
  }
  .answers button:hover:not(:disabled) { border-color: var(--accent); }
  .answers button:active:not(:disabled) { transform: scale(0.98); }
  .answers button kbd { font: 700 0.8rem var(--body); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; flex: none; }
  .answers button.right { border-color: var(--good); background: var(--good-bg); }
  .answers button.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .answers button:disabled { cursor: default; }
  .answers button:disabled:not(.right):not(.wrong) { opacity: 0.55; }
  .feedback { min-height: 1.5em; margin: 0; font-weight: 500; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .primary {
    font: 700 1rem var(--body); color: var(--accent-ink); background: var(--accent);
    border: 0; border-radius: 999px; padding: 13px 28px; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .intro p, .result p { margin: 0; color: var(--muted); line-height: 1.55; max-width: 52ch; }
  .intro h2, .result h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.5rem, 6vw, 2rem); margin: 0; text-wrap: balance; }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; }
  .cats button { font: 500 0.9rem var(--body); color: var(--ink); background: var(--bg); border: 2px solid transparent; border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  .cats button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .big { font-family: var(--display); font-size: clamp(3rem, 14vw, 4.5rem); line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
  .review { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .review li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 0.92rem; line-height: 1.4; }
  .review li span:first-child { font-weight: 700; }
  .review .ok span:first-child { color: var(--good); }
  .review .no span:first-child { color: var(--bad); }
  .review em { font-style: normal; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<main>
  <header>
    <h1>Quiz <span>Night</span></h1>
    <div class="stat">
      <div><small>Score</small><b id="score">0</b></div>
      <div><small>Streak</small><b id="streak">0</b></div>
      <div><small>Best</small><b id="best">0</b></div>
    </div>
  </header>

  <section class="card intro" id="intro">
    <h2>10 questions. 20 seconds each.</h2>
    <p>Pick a topic, then choose the right answer before the timer runs out. You get 100 points for a correct answer, plus a bonus for answering fast.</p>
    <div class="cats" id="cats" role="group" aria-label="Topic"></div>
    <div class="row"><button class="primary" id="startBtn" type="button">Start quiz</button></div>
  </section>

  <section class="card" id="play" hidden>
    <div class="meta"><span class="chip" id="qCat">Science</span><span id="qNum">Question 1 of 10</span></div>
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <h2 class="q" id="qText"></h2>
    <div class="answers" id="answers"></div>
    <p class="feedback" id="feedback" aria-live="polite"></p>
    <div class="row"><button class="primary" id="nextBtn" type="button" hidden>Next question</button></div>
  </section>

  <section class="card result" id="result" hidden>
    <h2 id="rTitle">Nice work</h2>
    <div class="big" id="rScore">0</div>
    <p id="rText"></p>
    <ul class="review" id="review"></ul>
    <div class="row"><button class="primary" id="againBtn" type="button">Play again</button></div>
  </section>
</main>

<script>
(() => {
  // Each question: [question, correct answer, wrong1, wrong2, wrong3]
  const BANK = {
    "Science": [
      ["What planet is known as the Red Planet?", "Mars", "Venus", "Jupiter", "Mercury"],
      ["What gas do plants absorb from the air?", "Carbon dioxide", "Oxygen", "Nitrogen", "Helium"],
      ["What is H₂O better known as?", "Water", "Salt", "Hydrogen peroxide", "Ammonia"],
      ["How many bones are in the adult human body?", "206", "186", "226", "306"],
      ["What is the hardest natural substance?", "Diamond", "Gold", "Iron", "Quartz"],
      ["Which organ pumps blood around the body?", "Heart", "Liver", "Lungs", "Kidney"],
      ["What is the closest star to Earth?", "The Sun", "Sirius", "Proxima Centauri", "Polaris"],
      ["At what temperature does water boil at sea level?", "100 °C", "90 °C", "110 °C", "80 °C"],
      ["Which planet has the most visible rings?", "Saturn", "Neptune", "Earth", "Mars"],
      ["What force keeps us on the ground?", "Gravity", "Magnetism", "Friction", "Inertia"],
      ["What is the chemical symbol for gold?", "Au", "Go", "Gd", "Ag"],
      ["Which blood cells fight infection?", "White blood cells", "Red blood cells", "Platelets", "Plasma"]
    ],
    "Geography": [
      ["What is the capital of Japan?", "Tokyo", "Kyoto", "Osaka", "Seoul"],
      ["Which is the largest ocean?", "Pacific", "Atlantic", "Indian", "Arctic"],
      ["Which country has the largest population in 2024?", "India", "China", "USA", "Indonesia"],
      ["What is the longest river in Africa?", "Nile", "Congo", "Niger", "Zambezi"],
      ["Mount Everest lies on the border of Nepal and…?", "China", "India", "Bhutan", "Pakistan"],
      ["What is the capital of Australia?", "Canberra", "Sydney", "Melbourne", "Perth"],
      ["Which desert is the largest hot desert?", "Sahara", "Gobi", "Kalahari", "Thar"],
      ["How many continents are there?", "7", "5", "6", "8"],
      ["The Taj Mahal is in which Indian city?", "Agra", "Delhi", "Jaipur", "Mumbai"],
      ["Which country is shaped like a boot?", "Italy", "Greece", "Spain", "Portugal"],
      ["What is the smallest country in the world?", "Vatican City", "Monaco", "Malta", "San Marino"],
      ["Which state is known as the Land of Five Rivers?", "Punjab", "Gujarat", "Kerala", "Assam"]
    ],
    "History": [
      ["Who was the first person to walk on the Moon?", "Neil Armstrong", "Buzz Aldrin", "Yuri Gagarin", "Michael Collins"],
      ["In what year did India gain independence?", "1947", "1950", "1942", "1857"],
      ["Who is known as the Father of the Nation in India?", "Mahatma Gandhi", "Jawaharlal Nehru", "Sardar Patel", "B. R. Ambedkar"],
      ["Which ancient civilization built the pyramids of Giza?", "Egyptians", "Romans", "Greeks", "Maya"],
      ["Who painted the Mona Lisa?", "Leonardo da Vinci", "Michelangelo", "Picasso", "Van Gogh"],
      ["In which year did World War II end?", "1945", "1918", "1939", "1950"],
      ["Who was the first President of the United States?", "George Washington", "Abraham Lincoln", "Thomas Jefferson", "John Adams"],
      ["The Great Wall was built in which country?", "China", "Mongolia", "Japan", "Korea"],
      ["Which empire did Akbar rule?", "Mughal Empire", "Maurya Empire", "Gupta Empire", "Maratha Empire"],
      ["What ship sank on its first voyage in 1912?", "Titanic", "Lusitania", "Britannic", "Queen Mary"],
      ["Who invented the telephone?", "Alexander Graham Bell", "Thomas Edison", "Nikola Tesla", "Guglielmo Marconi"],
      ["Who was India's first Prime Minister?", "Jawaharlal Nehru", "Indira Gandhi", "Lal Bahadur Shastri", "Rajendra Prasad"]
    ],
    "Sports": [
      ["How many players are on a cricket team on the field?", "11", "9", "10", "12"],
      ["Which country won the 2011 Cricket World Cup?", "India", "Australia", "Sri Lanka", "England"],
      ["How many rings are on the Olympic flag?", "5", "4", "6", "7"],
      ["In which sport is the term 'checkmate' used?", "Chess", "Tennis", "Boxing", "Golf"],
      ["How long is a standard marathon?", "42.195 km", "40 km", "21.1 km", "50 km"],
      ["Which sport uses a shuttlecock?", "Badminton", "Squash", "Table tennis", "Volleyball"],
      ["How many players are on a football (soccer) team on the field?", "11", "10", "9", "12"],
      ["Who is called the 'God of Cricket'?", "Sachin Tendulkar", "Virat Kohli", "MS Dhoni", "Kapil Dev"],
      ["Which sport is the national game of Bangladesh?", "Kabaddi", "Hockey", "Kho-kho", "Polo"],
      ["How many points is a basketball shot from beyond the arc?", "3", "2", "4", "1"],
      ["Which country hosts the Wimbledon tennis tournament?", "United Kingdom", "USA", "France", "Australia"],
      ["How often are the Summer Olympics held?", "Every 4 years", "Every 2 years", "Every year", "Every 5 years"]
    ],
    "Fun facts": [
      ["How many legs does a spider have?", "8", "6", "10", "12"],
      ["What is the largest mammal?", "Blue whale", "Elephant", "Giraffe", "Hippo"],
      ["How many days are in a leap year?", "366", "365", "364", "367"],
      ["Which animal is known as the King of the Jungle?", "Lion", "Tiger", "Elephant", "Gorilla"],
      ["What color do you get by mixing blue and yellow?", "Green", "Purple", "Orange", "Brown"],
      ["How many hours are in a week?", "168", "144", "156", "172"],
      ["Which fruit is known for keeping the doctor away?", "Apple", "Banana", "Mango", "Orange"],
      ["What is the fastest land animal?", "Cheetah", "Horse", "Lion", "Greyhound"],
      ["How many sides does a hexagon have?", "6", "5", "7", "8"],
      ["Which bird is a symbol of peace?", "Dove", "Eagle", "Crow", "Parrot"],
      ["What do bees make?", "Honey", "Milk", "Silk", "Wax paper"],
      ["How many minutes are in 3 hours?", "180", "120", "160", "300"]
    ]
  };
  const ROUND = 10, TIME = 20;
  const $ = id => document.getElementById(id);
  const intro = $('intro'), play = $('play'), result = $('result');
  const answersEl = $('answers'), feedback = $('feedback'), nextBtn = $('nextBtn');
  const bar = $('bar'), barFill = $('barFill');
  const cats = ["Mixed", ...Object.keys(BANK)];
  let cat = "Mixed";
  try { cat = localStorage.getItem('quiz-night-cat') || "Mixed"; if (!cats.includes(cat)) cat = "Mixed"; } catch {}
  let best = 0;
  try { best = +localStorage.getItem('quiz-night-best') || 0; } catch {}
  $('best').textContent = best;

  let qs, idx, score, streak, timer, deadline, log, locked;

  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  function renderCats() {
    $('cats').innerHTML = '';
    for (const c of cats) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = c; b.setAttribute('aria-pressed', c === cat);
      b.onclick = () => { cat = c; try { localStorage.setItem('quiz-night-cat', c); } catch {} renderCats(); };
      $('cats').appendChild(b);
    }
  }

  function start() {
    const pool = cat === "Mixed"
      ? Object.entries(BANK).flatMap(([c, list]) => list.map(q => [c, q]))
      : BANK[cat].map(q => [cat, q]);
    qs = shuffle(pool).slice(0, ROUND);
    idx = 0; score = 0; streak = 0; log = [];
    $('score').textContent = 0; $('streak').textContent = 0;
    intro.hidden = true; result.hidden = true; play.hidden = false;
    show();
  }

  function show() {
    const [c, [q, right, ...wrong]] = qs[idx];
    $('qCat').textContent = c;
    $('qNum').textContent = `Question ${idx + 1} of ${qs.length}`;
    $('qText').textContent = q;
    feedback.textContent = ''; feedback.className = 'feedback';
    nextBtn.hidden = true; locked = false;
    answersEl.innerHTML = '';
    shuffle([right, ...wrong]).forEach((a, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.dataset.answer = a;
      b.innerHTML = `<kbd>${'ABCD'[i]}</kbd><span></span>`;
      b.querySelector('span').textContent = a;
      b.onclick = () => choose(a);
      answersEl.appendChild(b);
    });
    deadline = performance.now() + TIME * 1000;
    clearInterval(timer);
    timer = setInterval(tick, 100);
    tick();
  }

  function tick() {
    const left = Math.max(0, deadline - performance.now());
    barFill.style.width = (left / (TIME * 1000) * 100) + '%';
    bar.classList.toggle('low', left < 5000);
    if (left <= 0 && !locked) choose(null);
  }

  function choose(a) {
    if (locked) return;
    locked = true; clearInterval(timer);
    const [, [q, right]] = qs[idx];
    const ok = a === right;
    const secsLeft = Math.max(0, (deadline - performance.now()) / 1000);
    for (const b of answersEl.children) {
      b.disabled = true;
      if (b.dataset.answer === right) b.classList.add('right');
      else if (b.dataset.answer === a) b.classList.add('wrong');
    }
    if (ok) {
      const pts = 100 + Math.round(secsLeft * 5);
      score += pts; streak++;
      feedback.textContent = `Correct! +${pts} points`;
      feedback.classList.add('good');
    } else {
      streak = 0;
      feedback.textContent = a === null ? `Time's up. The answer is ${right}.` : `Not quite. The answer is ${right}.`;
      feedback.classList.add('bad');
    }
    log.push({ q, right, ok, picked: a });
    $('score').textContent = score; $('streak').textContent = streak;
    nextBtn.textContent = idx + 1 < qs.length ? 'Next question' : 'See results';
    nextBtn.hidden = false; nextBtn.focus();
  }

  function next() {
    idx++;
    if (idx < qs.length) show(); else finish();
  }

  function finish() {
    play.hidden = true; result.hidden = false;
    const correct = log.filter(l => l.ok).length;
    const newBest = score > best;
    if (newBest) { best = score; $('best').textContent = best; try { localStorage.setItem('quiz-night-best', best); } catch {} }
    $('rTitle').textContent = correct >= 9 ? 'Quiz champion!' : correct >= 7 ? 'Great job' : correct >= 4 ? 'Not bad' : 'Keep practicing';
    $('rScore').textContent = score;
    $('rText').textContent = `You got ${correct} of ${log.length} right.` + (newBest ? ' That is a new best score!' : ` Best score: ${best}.`);
    $('review').innerHTML = '';
    for (const l of log) {
      const li = document.createElement('li');
      li.className = l.ok ? 'ok' : 'no';
      li.innerHTML = `<span>${l.ok ? '✓' : '✗'}</span><span></span>`;
      const t = li.lastChild;
      t.textContent = l.q + ' ';
      const em = document.createElement('em');
      em.textContent = l.ok ? l.right : `${l.picked ? 'You said ' + l.picked + '. ' : 'No answer. '}Answer: ${l.right}`;
      t.appendChild(em);
      $('review').appendChild(li);
    }
    $('againBtn').focus();
  }

  $('startBtn').onclick = start;
  nextBtn.onclick = next;
  $('againBtn').onclick = () => { result.hidden = true; intro.hidden = false; };
  addEventListener('keydown', e => {
    if (play.hidden || locked) return;
    const i = 'abcd1234'.indexOf(e.key.toLowerCase()) % 4;
    if (i >= 0 && answersEl.children[i]) answersEl.children[i].click();
  });
  renderCats();
})();
</script>
</body>
</html>
